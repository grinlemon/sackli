<!-- Mot de passe oublié. Même construction que confirmation.html, avec type=recovery. -->
<!doctype html>
<html lang="fr">
<body style="margin:0;padding:32px 16px;background:#f7f8f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#2b332f">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;margin:0 auto">
    <tr><td style="padding:0 0 18px;font-size:15px;font-weight:700">säckli <span style="color:#16734e;font-family:Georgia,serif">budget</span></td></tr>
    <tr><td style="background:#ffffff;border:1px solid #e1e5e3;border-radius:10px;padding:28px">
      <h1 style="margin:0 0 10px;font-family:Georgia,serif;font-weight:500;font-size:22px">Choisir un nouveau mot de passe</h1>
      <p style="margin:0 0 22px;font-size:14px;line-height:1.5">Une demande de nouveau mot de passe a été faite pour le compte {{ .Email }}.</p>
      <p style="margin:0 0 22px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#3ecf8e;color:#143b2b;font-weight:700;text-decoration:none;padding:11px 16px;border-radius:7px">Choisir un mot de passe</a></p>
      <p style="margin:0;font-size:12px;color:#6b716e">Le lien est valable une heure et ne sert qu'une fois.</p>
    </td></tr>
    <tr><td style="padding:16px 4px 0;font-size:11px;color:#6b716e">Vous n'avez rien demandé ? Ignorez cet email : votre mot de passe actuel reste valable.</td></tr>
  </table>
</body>
</html>
