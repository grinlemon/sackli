<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- ?v= : les navigateurs gardent un favicon en cache des semaines ; on change
         la version quand le logo change. Le .ico sert Safari, qui ignore le SVG. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
  <script defer data-domain="sackli.app" src="https://analytics.kodai.ch/js/script.file-downloads.outbound-links.js"></script>
  <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
</html>
